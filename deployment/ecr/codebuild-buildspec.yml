# Builds gaab-strands-agent and pushes to the shared deployment-platform ECR prefix.
# Runs in AWS CodeBuild (privileged) — no local Docker required.
# Env (set by CDK trigger or StartBuild): IMAGE_TAG, ECR_REPOSITORY_PREFIX, AWS_DEFAULT_REGION

version: 0.2

env:
  variables:
    IMAGE_NAME: gaab-strands-agent

phases:
  pre_build:
    commands:
      - export AWS_ACCOUNT_ID="${AWS_ACCOUNT_ID:-$(aws sts get-caller-identity --query Account --output text)}"
      - export AWS_DEFAULT_REGION="${AWS_DEFAULT_REGION:-us-east-1}"
      - echo "Building ${IMAGE_NAME}:${IMAGE_TAG} -> ${ECR_REPOSITORY_PREFIX}/${IMAGE_NAME}:${IMAGE_TAG}"
      - export ECR_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"
      - export DEST_REPO="${ECR_REPOSITORY_PREFIX}/${IMAGE_NAME}"
      - export DEST_URI="${ECR_REGISTRY}/${DEST_REPO}:${IMAGE_TAG}"
      - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
      - python3 -m pip install --upgrade pip
      - python3 -m pip install 'uv>=0.5.0'
      - export PATH="$(python3 -m site --user-base)/bin:${PATH}"
      - |
        aws ecr describe-repositories --repository-names "$DEST_REPO" --region "$AWS_DEFAULT_REGION" 2>/dev/null \
          || aws ecr create-repository --repository-name "$DEST_REPO" --region "$AWS_DEFAULT_REGION" \
               --image-scanning-configuration scanOnPush=true
      - cp -R gaab-strands-common gaab-strands-agent/
      - cd gaab-strands-agent
      - export DOCKER_HOST="${DOCKER_HOST:-tcp://127.0.0.1:2375}"
      - export PLATFORM="${PLATFORM:-linux/arm64}"
  build:
    commands:
      - export PATH="$(python3 -m site --user-base)/bin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:$PATH"
      - export DOCKER_HOST="${DOCKER_HOST:-tcp://127.0.0.1:2375}"
      - |
        for i in $(seq 1 30); do
          if docker info >/dev/null 2>&1; then
            echo "Docker daemon ready"
            break
          fi
          echo "Waiting for Docker daemon... ($i/30)"
          sleep 2
        done
      - docker version
      - export TAG="${IMAGE_TAG:-latest}"
      - chmod +x scripts/build-container.sh
      - ./scripts/build-container.sh
      - docker tag "${IMAGE_NAME}:${TAG}" "$DEST_URI"
  post_build:
    commands:
      - docker push "$DEST_URI"
      - echo "Pushed $DEST_URI"

artifacts:
  files:
    - '**/*'
